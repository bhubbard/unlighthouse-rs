<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <style>
  button[disabled] {
    opacity: 0.5;
    cursor: not-allowed;
  }
  </style>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Unlighthouse - Scan your entire site with Google Lighthouse.">
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml" media="(prefers-color-scheme:no-preference)">
  <link rel="icon" href="/assets/logo-dark.svg" type="image/svg+xml" media="(prefers-color-scheme:dark)">
  <link rel="icon" href="/assets/logo-light.svg" type="image/svg+xml" media="(prefers-color-scheme:light)">
  <link rel="preload" href="/fonts/dm-sans-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/dm-mono-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/dm-mono-500.woff2" as="font" type="font/woff2" crossorigin>

  <style>
    /* DM Mono */
    @font-face {
      font-family: 'DM Mono';
      font-style: normal;
      font-weight: 300;
      font-display: swap;
      src: url(/fonts/dm-mono-300.woff2) format('woff2');
    }
    @font-face {
      font-family: 'DM Mono';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url(/fonts/dm-mono-400.woff2) format('woff2');
    }
    @font-face {
      font-family: 'DM Mono';
      font-style: normal;
      font-weight: 500;
      font-display: swap;
      src: url(/fonts/dm-mono-500.woff2) format('woff2');
    }
    @font-face {
      font-family: 'DM Mono';
      font-style: italic;
      font-weight: 300;
      font-display: swap;
      src: url(/fonts/dm-mono-300-italic.woff2) format('woff2');
    }
    @font-face {
      font-family: 'DM Mono';
      font-style: italic;
      font-weight: 400;
      font-display: swap;
      src: url(/fonts/dm-mono-400-italic.woff2) format('woff2');
    }
    @font-face {
      font-family: 'DM Mono';
      font-style: italic;
      font-weight: 500;
      font-display: swap;
      src: url(/fonts/dm-mono-500-italic.woff2) format('woff2');
    }

    /* DM Sans (Variable) */
    @font-face {
      font-family: 'DM Sans';
      font-style: normal;
      font-weight: 100 1000;
      font-display: swap;
      src: url(/fonts/dm-sans-normal.woff2) format('woff2');
    }
    @font-face {
      font-family: 'DM Sans';
      font-style: italic;
      font-weight: 100 1000;
      font-display: swap;
      src: url(/fonts/dm-sans-italic.woff2) format('woff2');
    }

    /* DM Serif Display */
    @font-face {
      font-family: 'DM Serif Display';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url(/fonts/dm-serif-display-400.woff2) format('woff2');
    }
    @font-face {
      font-family: 'DM Serif Display';
      font-style: italic;
      font-weight: 400;
      font-display: swap;
      src: url(/fonts/dm-serif-display-400-italic.woff2) format('woff2');
    }
  </style>
  <title>Unlighthouse</title>
  <script data-unlighthouse-inline>
  window.__unlighthouse_static = true
  // boilerplate options to run the client by itself
  </script>
  <style>
  /* scroll bars courtesy of https://antfu.me/ */
  :root {
    --c-bg: #fff;
    --c-scrollbar: #eee;
    --c-scrollbar-hover: #bbb
  }

  html.dark {
    --c-bg: #050505;
    --c-scrollbar: #111;
    --c-scrollbar-hover: #222
  }

  * {
    scrollbar-color: var(--c-scrollbar) var(--c-bg)
  }

  ::-webkit-scrollbar {
    width: 6px
  }

  ::-webkit-scrollbar:horizontal {
    height: 6px
  }

  ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner {
    background: var(--c-bg);
    border-radius: 10px
  }

  ::-webkit-scrollbar-thumb {
    background: var(--c-scrollbar);
    border-radius: 10px
  }

  ::-webkit-scrollbar-thumb:hover {
    background: var(--c-scrollbar-hover)
  }
  </style>
</head>
<body class="dark:bg-[#020617]">
<div id="app"></div>
<script>
(function () {
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
  const setting = localStorage.getItem('color-schema') || 'auto'
  if (setting === 'dark' || (prefersDark && setting !== 'light'))
    document.documentElement.classList.toggle('dark', true)

  // document.title = __unlighthouse_data.options.host.replace(/https?:\/\/(www.)?/, '') + ' | Unlighthouse'
})()
</script>
<script type="module" src="/main.ts"></script>
</body>
</html>
