[package]
name = "unlighthouse-rs"
version = "0.1.0"
edition = "2021"
description = "Rust port of unlighthouse core: URL discovery, job orchestration, API server, and CI reporting"
default-run = "unlighthouse-rs"

[lib]
name = "unlighthouse_rs"
path = "src/lib.rs"

[[bin]]
name = "unlighthouse-rs"
path = "src/main.rs"

[features]
default = [ "native" ]
native = [
  "dep:tokio",
  "dep:axum",
  "dep:tower",
  "dep:tower-http",
  "dep:headless_chrome",
  "dep:chromiumoxide",
  "dep:num_cpus",
  "dep:rust-embed",
  "dep:mime_guess",
  "dep:image",
  "dep:base64",
  "dep:chrono",
  "dep:sqlx"
]

[dependencies]
# Async runtime (only needed for native target runtime)
tokio = { version = "1", features = [ "full" ], optional = true }

# CLI (clap will compile to WASM target, but is only run in native CLI)
clap = { version = "4", features = [
  "derive",
  "env"
] }

# Serialization
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
toml = "0.8"
base64 = { version = "0.22", optional = true }
regex = "1.10"

# HTTP client — use rustls so we don't need system OpenSSL dev headers
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "gzip",
  "rustls-tls",
  "charset",
  "http2",
  "cookies"
] }

# HTML parsing (used during URL discovery / static crawl)
scraper = "0.20"

# Two browser backends — selectable at runtime via --browser flag.
# headless_chrome: sync API, stable with all Chrome versions (default)
# chromiumoxide:   async/tokio-native CDP (may crash on some Chrome internal events)
headless_chrome = { version = "1", optional = true }
chromiumoxide = { version = "0.7", features = [ "tokio-runtime" ], optional = true }

# Web server
axum = { version = "0.7", features = [
  "ws",
  "macros"
], optional = true }
tower = { version = "0.4", optional = true }
tower-http = { version = "0.6", features = [
  "fs",
  "cors",
  "trace",
  "compression-full"
], optional = true }

# XML parsing for sitemaps
quick-xml = { version = "0.36", features = [ "serialize" ] }

# Error handling
anyhow = "1"
thiserror = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "fmt"
] }

# Hashing (for route IDs)
md5 = "0.7"

# URL parsing
url = "2"

# CSV writing
csv = "1"

# Glob pattern matching (replaces hand-rolled DP in discovery/routes.rs)
glob = "0.3"

# Process detection
num_cpus = { version = "1", optional = true }

# Time
chrono = { version = "0.4", features = [ "serde" ], optional = true }

# SQLite persistence — historical score trending across scan runs.
# runtime-tokio-rustls = tokio async runtime + rustls (TLS unused for SQLite
# but sqlx requires a runtime+tls feature pair to be selected).
sqlx = { version = "0.7", features = [ "sqlite", "runtime-tokio-rustls" ], optional = true }

# Futures utilities (needed for chromiumoxide handler StreamExt)
futures = "0.3"

# Asset embedding
rust-embed = { version = "8", optional = true }
mime_guess = { version = "2", optional = true }

# Image processing
image = { version = "0.25", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
